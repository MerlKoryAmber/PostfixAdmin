{% extends "base.html" %}

{% block content %}
<h2>Mail Server Logs</h2>

<div class="mb-3">
    <form method="GET" class="row g-3">
        <div class="col-auto">
            <select name="filter" class="form-select">
                <option value="all" {% if filter_type == 'all' %}selected{% endif %}>All Entries</option>
                <option value="postfix" {% if filter_type == 'postfix' %}selected{% endif %}>Postfix Only</option>
                <option value="errors" {% if filter_type == 'errors' %}selected{% endif %}>Errors Only</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="search" class="form-control" placeholder="Search..." 
                   value="{{ search }}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Apply Filter</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="card-header">
        <span>Log File: /var/log/maillog</span>
    </div>
    <div class="card-body log-viewer">
        <pre><code>{% for line in lines %}{{ line }}
{% endfor %}</code></pre>
    </div>
</div>
{% endblock %}
