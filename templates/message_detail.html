{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📧 Message Details</h2>
    <a href="{{ url_for('view_queue') }}" class="btn btn-outline-primary">← Back to Queue</a>
</div>

<div class="card mb-3">
    <div class="card-header">
        <strong>Queue ID:</strong> <code>{{ queue_id }}</code>
    </div>
    <div class="card-body">
        <h5>Headers</h5>
        <table class="table table-sm table-bordered">
            <tbody>
                {% for key, value in headers.items() %}
                <tr>
                    <th style="width: 200px;">{{ key }}</th>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        {% if body %}
        <h5 class="mt-3">Message Body</h5>
        <pre class="bg-light p-3 border rounded" style="max-height: 400px; overflow-y: auto;">{{ body }}</pre>
        {% endif %}
    </div>
</div>

<div class="btn-group">
    <a href="{{ url_for('requeue_message', queue_id=queue_id) }}" 
       class="btn btn-success">🔄 Requeue</a>
    <a href="{{ url_for('hold_message', queue_id=queue_id) }}" 
       class="btn btn-warning">⏸️ Hold</a>
    <a href="{{ url_for('release_message', queue_id=queue_id) }}" 
       class="btn btn-info">▶️ Release</a>
    <a href="{{ url_for('delete_queue_message', queue_id=queue_id) }}" 
       class="btn btn-danger"
       onclick="return confirm('Delete this message?')">🗑️ Delete</a>
</div>
{% endblock %}
