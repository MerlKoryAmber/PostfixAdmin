<div class="row">
    <div class="col-md-6">
        <div class="mb-3">
            <label for="field_sender" class="form-label">Sender *</label>
            <input type="text" class="form-control" id="field_sender" name="sender"
                   placeholder="user@example.com or @domain.com" required>
        </div>
    </div>
    <div class="col-md-6">
        <div class="mb-3">
            <label for="field_transport" class="form-label">Relay Host *</label>
            <input type="text" class="form-control" id="field_transport" name="transport"
                   placeholder="relay.example.com:587" required>
            <div class="form-text">
                {% if routing_mode == 'relayhost' %}
                Saved as <code>[host]:port</code> in relayhost map
                {% else %}
                Saved as <code>smtp:[host]:port</code> in transport map
                {% endif %}
            </div>
        </div>
    </div>
</div>

<div class="mb-3">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="field_use_auth"
               name="use_auth" value="yes">
        <label class="form-check-label" for="field_use_auth">Use SASL authentication</label>
    </div>
</div>

<div id="field_authFields" style="display: none;">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="field_smtp_username" class="form-label">Username</label>
                <input type="text" class="form-control" id="field_smtp_username" name="smtp_username">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="field_smtp_password" class="form-label">Password</label>
                <input type="password" class="form-control" id="field_smtp_password" name="smtp_password"
                       autocomplete="new-password">
            </div>
        </div>
    </div>
</div>

{% if routing_mode == 'transport' %}
<div class="row">
    <div class="col-md-6">
        <div class="mb-3">
            <label for="field_smtp_tls_security_level" class="form-label">TLS Level</label>
            <select class="form-select" id="field_smtp_tls_security_level" name="smtp_tls_security_level">
                <option value="">— Default —</option>
                <option value="none">none</option>
                <option value="may">may</option>
                <option value="encrypt">encrypt</option>
            </select>
        </div>
    </div>
    <div class="col-md-6">
        <div class="mb-3">
            <label for="field_smtp_bind_address" class="form-label">Bind IP Address</label>
            <input type="text" class="form-control" id="field_smtp_bind_address" name="smtp_bind_address"
                   placeholder="203.0.113.10">
            <div class="form-text">Outgoing connection source IP (smtp_bind_address)</div>
        </div>
    </div>
</div>
{% endif %}
