[Unit]
Description=Postfix Admin Web Interface
After=network.target postfix.service

[Service]
Type=simple
User=postfixadmin
Group=postfixadmin
WorkingDirectory=/opt/postfix-admin
Environment="PATH=/opt/postfix-admin/venv/bin"
Environment="SECRET_KEY=change-this-to-random-secret-key"
Environment="USERS_FILE=/opt/postfix-admin/users.json"
ExecStart=/opt/postfix-admin/venv/bin/gunicorn -w 4 -b 127.0.0.1:8000 app:app
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.target